<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forensic Analyst Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e222d; display: flex; align-items: center; justify-content: center; height: 100vh; color: #fff; }
        .login-box { width: 100%; max-width: 380px; padding: 30px; border-radius: 8px; background: #282f3d; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    </style>
</head>
<body>
<div class="login-box">
    <h4 class="text-center mb-3">Triage Portal</h4>
    <p class="text-secondary text-center small mb-4">SOC Analyst Authentication</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }} p-2 text-center" role="alert">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label text-light">Analyst User</label>
            <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-light">Secret Key / Password</label>
            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
        </div>
        <button type="submit" class="btn btn-danger w-100 mt-2">Authenticate</button>
    </form>
</div>
</body>
</html>
